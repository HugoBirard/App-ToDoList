<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Texture béton armé brut -->
    <pattern id="concrete-grid" width="300" height="200" patternUnits="userSpaceOnUse">
      <rect width="300" height="200" fill="#060608"/>
      <rect x="2" y="2" width="296" height="196" fill="#0a0a0d" stroke="#121318" stroke-width="2"/>
      <!-- Trous de banche béton industriel -->
      <circle cx="25" cy="25" r="4" fill="#040405" stroke="#181a20" stroke-width="1.5"/>
      <circle cx="275" cy="25" r="4" fill="#040405" stroke="#181a20" stroke-width="1.5"/>
      <circle cx="25" cy="175" r="4" fill="#040405" stroke="#181a20" stroke-width="1.5"/>
      <circle cx="275" cy="175" r="4" fill="#040405" stroke="#181a20" stroke-width="1.5"/>
    </pattern>

    <linearGradient id="laser-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="warehouse-spot" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#22242d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0.98"/>
    </radialGradient>
  </defs>

  <!-- Fond béton warehouse -->
  <rect width="1920" height="1080" fill="url(#concrete-grid)"/>
  <rect width="1920" height="1080" fill="url(#warehouse-spot)"/>

  <!-- Faisceaux Lasers Blancs Verticaux Minimalistes -->
  <g opacity="0.35">
    <rect x="240" y="0" width="2" height="1080" fill="url(#laser-beam)"/>
    <rect x="520" y="0" width="3" height="1080" fill="url(#laser-beam)"/>
    <rect x="1400" y="0" width="3" height="1080" fill="url(#laser-beam)"/>
    <rect x="1680" y="0" width="2" height="1080" fill="url(#laser-beam)"/>
  </g>

  <!-- Typographie Industrielle & Métrique Techno -->
  <g transform="translate(1420, 80)" opacity="0.25" font-family="'Courier New', monospace">
    <text x="0" y="0" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="8">138 BPM</text>
    <text x="0" y="30" font-size="14" font-weight="bold" fill="#94a3b8" letter-spacing="4">BERLIN INDUSTRIAL SOUND / 4-4 KICK</text>
    <line x1="0" y1="50" x2="350" y2="50" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="80" font-size="12" fill="#64748b" letter-spacing="2">OUTPUT FREQ: 32Hz SUB-BASS</text>
  </g>

  <!-- Visualiseur Waveform Audio Minimaliste en bas -->
  <g transform="translate(100, 920)" opacity="0.2" fill="#ffffff">
    <rect x="0" y="20" width="4" height="40"/>
    <rect x="10" y="10" width="4" height="60"/>
    <rect x="20" y="30" width="4" height="20"/>
    <rect x="30" y="5" width="4" height="70"/>
    <rect x="40" y="15" width="4" height="50"/>
    <rect x="50" y="0" width="4" height="80"/>
    <rect x="60" y="25" width="4" height="30"/>
    <rect x="70" y="10" width="4" height="60"/>
    <rect x="80" y="35" width="4" height="10"/>
    <rect x="90" y="5" width="4" height="70"/>
    <rect x="100" y="20" width="4" height="40"/>
    <text x="130" y="50" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="4">CONTINUOUS WAVE GENERATOR</text>
  </g>
</svg>
