<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dégradé métallique irisé Y2K -->
    <linearGradient id="y2k-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="40%" stop-color="#2a2347"/>
      <stop offset="70%" stop-color="#3d2b5c"/>
      <stop offset="100%" stop-color="#121324"/>
    </linearGradient>

    <!-- Chrome liquide avec brillance -->
    <linearGradient id="chrome-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="y2k-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#y2k-metal)"/>

  <!-- Halo central Y2K -->
  <circle cx="960" cy="540" r="600" fill="url(#y2k-glow)"/>

  <!-- Formes organiques chromées liquides en arrière-plan -->
  <g opacity="0.35">
    <!-- Goutte liquide chrome géante à droite -->
    <path d="M 1400,200 C 1600,100 1800,300 1750,550 C 1700,800 1500,900 1350,750 C 1200,600 1200,300 1400,200 Z" fill="url(#chrome-shine)"/>
    
    <!-- Sphère métallique à gauche -->
    <path d="M 300,500 C 450,400 550,600 480,750 C 410,900 220,850 180,700 C 140,550 150,600 300,500 Z" fill="url(#chrome-shine)"/>
  </g>

  <!-- Étoiles Y2K à 4 branches typiques des années 2000 -->
  <g fill="#ffffff" opacity="0.6">
    <path d="M 850,220 Q 850,260 810,260 Q 850,260 850,300 Q 850,260 890,260 Q 850,260 850,220 Z" fill="url(#chrome-shine)"/>
    <path d="M 1250,720 Q 1250,750 1220,750 Q 1250,750 1250,780 Q 1250,750 1280,750 Q 1250,750 1250,720 Z" fill="url(#chrome-shine)"/>
    <path d="M 350,180 Q 350,200 330,200 Q 350,200 350,220 Q 350,200 370,200 Q 350,200 350,180 Z" fill="#ffffff"/>
  </g>
</svg>
