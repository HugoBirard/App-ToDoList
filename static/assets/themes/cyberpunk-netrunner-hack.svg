<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Grille de scanlines CRT -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.8" opacity="0.6"/>
    </pattern>

    <!-- Grille réticulaire hexagonale / circuit -->
    <pattern id="cyber-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.08"/>
      <circle cx="80" cy="80" r="1.5" fill="#00f5d4" opacity="0.25"/>
      <circle cx="0" cy="0" r="1.5" fill="#ff007f" opacity="0.25"/>
    </pattern>

    <!-- Lueur néon cyber -->
    <filter id="cyber-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dégradé vignette sombre -->
    <radialGradient id="cyber-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c0414" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#06020a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020005" stop-opacity="0.99"/>
    </radialGradient>
  </defs>

  <!-- Fond noir cyber profond -->
  <rect width="1920" height="1080" fill="#05010a"/>
  
  <!-- Grille technologique en arrière-plan -->
  <rect width="1920" height="1080" fill="url(#cyber-grid)"/>

  <!-- Vignette de profondeur -->
  <rect width="1920" height="1080" fill="url(#cyber-vignette)"/>

  <!-- ========================================================
       HUD DE HACK BREACH PROTOCOL (CYBERPUNK 2077 NETRUNNER)
       ======================================================== -->

  <!-- 1. En-tête HUD supérieur "BREACH PROTOCOL INITIALIZED" -->
  <g transform="translate(60, 40)" opacity="0.55" filter="url(#cyber-glow)">
    <polygon points="0,0 380,0 410,32 0,32" fill="rgba(0, 245, 212, 0.12)" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="18" y="22" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#00f5d4" letter-spacing="3">BREACH PROTOCOL v2.077 // ACTIVE</text>
    
    <!-- RAM BUFFER & TIMEOUT -->
    <g transform="translate(430, 0)">
      <rect x="0" y="0" width="220" height="32" fill="rgba(255, 0, 127, 0.1)" stroke="#ff007f" stroke-width="1.5"/>
      <text x="15" y="21" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ff007f" letter-spacing="2">BUFFER: [ 1C 55 BD ]</text>
    </g>

    <!-- CYBERDECK RAM STATS -->
    <g transform="translate(670, 0)">
      <rect x="0" y="0" width="180" height="32" fill="rgba(250, 204, 21, 0.08)" stroke="#facc15" stroke-width="1.5"/>
      <text x="15" y="21" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#facc15" letter-spacing="2">RAM: 16/16 GB</text>
    </g>
  </g>

  <!-- 2. Matrice de code Hexadécimal de Hack (Breach Matrix) sur le côté droit -->
  <g transform="translate(1380, 120)" opacity="0.45" filter="url(#cyber-glow)">
    <!-- Cadre de la matrice avec encoches angulaires -->
    <polygon points="0,0 460,0 480,20 480,480 460,500 0,500" fill="rgba(6, 2, 18, 0.75)" stroke="#00f5d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="36" fill="rgba(0, 245, 212, 0.2)"/>
    <text x="18" y="24" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#00f5d4" letter-spacing="3">CODE MATRIX [TARGET NODE]</text>
    
    <!-- Ligne de scan active (surbrillance hex) -->
    <rect x="15" y="115" width="450" height="32" fill="rgba(255, 0, 127, 0.25)" stroke="#ff007f" stroke-width="1"/>

    <!-- Grille de codes hexadécimaux -->
    <g font-family="'Courier New', monospace" font-size="17" font-weight="bold" letter-spacing="8" fill="#a5f3fc">
      <text x="35" y="80">BD  E9  1C  55  7A  FF</text>
      <text x="35" y="137" fill="#ffffff" font-weight="900">1C  55  BD  E9  FF  7A</text>
      <text x="35" y="194">7A  1C  55  BD  E9  1C</text>
      <text x="35" y="251">55  BD  FF  7A  1C  E9</text>
      <text x="35" y="308">E9  7A  1C  55  BD  FF</text>
      <text x="35" y="365">FF  1C  BD  E9  55  7A</text>
      <text x="35" y="422">55  E9  7A  1C  FF  BD</text>
      <text x="35" y="475">1C  FF  55  BD  7A  E9</text>
    </g>

    <!-- Curseur réticule sur [ 55 ] -->
    <rect x="100" y="118" width="38" height="26" fill="none" stroke="#ffff00" stroke-width="2"/>
  </g>

  <!-- 3. Séquences de Daemons à uploader (Datamine_V1, Datamine_V2, Icepick) -->
  <g transform="translate(1380, 650)" opacity="0.4" font-family="'Courier New', monospace">
    <rect x="0" y="0" width="480" height="280" fill="rgba(8, 3, 20, 0.7)" stroke="#ff007f" stroke-width="1.5"/>
    <text x="18" y="32" font-size="14" font-weight="bold" fill="#ff007f" letter-spacing="2">SEQUENCE TO UPLOAD</text>
    
    <!-- Daemon 1 -->
    <g transform="translate(20, 50)">
      <text x="0" y="25" font-size="13" fill="#cbd5e1">DATAMINE_V1.HEX</text>
      <rect x="160" y="8" width="40" height="24" fill="rgba(0, 245, 212, 0.2)" stroke="#00f5d4" stroke-width="1"/>
      <text x="172" y="25" font-size="13" font-weight="bold" fill="#00f5d4">1C</text>
      <rect x="210" y="8" width="40" height="24" fill="rgba(0, 245, 212, 0.2)" stroke="#00f5d4" stroke-width="1"/>
      <text x="222" y="25" font-size="13" font-weight="bold" fill="#00f5d4">55</text>
    </g>

    <!-- Daemon 2 -->
    <g transform="translate(20, 110)">
      <text x="0" y="25" font-size="13" fill="#cbd5e1">ICEPICK_DAEMON</text>
      <rect x="160" y="8" width="40" height="24" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="1"/>
      <text x="172" y="25" font-size="13" font-weight="bold" fill="#ff007f">BD</text>
      <rect x="210" y="8" width="40" height="24" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="1"/>
      <text x="222" y="25" font-size="13" font-weight="bold" fill="#ff007f">E9</text>
      <rect x="260" y="8" width="40" height="24" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="1"/>
      <text x="272" y="25" font-size="13" font-weight="bold" fill="#ff007f">7A</text>
    </g>

    <!-- Barre d'avancement du Hack -->
    <g transform="translate(20, 190)">
      <text x="0" y="16" font-size="12" fill="#94a3b8">COMPLETION STATUS: 88%</text>
      <rect x="0" y="26" width="440" height="12" fill="#1e1530" stroke="#ff007f" stroke-width="1"/>
      <rect x="2" y="28" width="380" height="8" fill="url(#cyber-grad-bar)"/>
    </g>
  </g>

  <linearGradient id="cyber-grad-bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff007f"/>
    <stop offset="70%" stop-color="#00f5d4"/>
    <stop offset="100%" stop-color="#ccff00"/>
  </linearGradient>

  <!-- 4. Réticule Cybernétique / Visée Netrunner en bas à gauche -->
  <g transform="translate(80, 800)" opacity="0.35" filter="url(#cyber-glow)">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="14, 8"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#ff007f" stroke-width="1.5"/>
    <line x1="10" y1="100" x2="190" y2="100" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="100" y1="10" x2="100" y2="190" stroke="#00f5d4" stroke-width="1.5"/>
    <polygon points="100,85 115,115 85,115" fill="#facc15"/>
    <text x="210" y="85" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f5d4" letter-spacing="3">NODE: LOCAL_SYSTEM</text>
    <text x="210" y="110" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ff007f" letter-spacing="2">SECURITY LEVEL: ULTRA</text>
    <text x="210" y="135" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8" letter-spacing="2">ACCESS GRANTED: ROOT</text>
  </g>

  <!-- 5. Filtre de Scanlines CRT cinématographique par-dessus -->
  <rect width="1920" height="1080" fill="url(#scanlines)" pointer-events="none" />
</svg>
