<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond liquide de la lampe à lave (rouge pourpre profond vers violet nuit) -->
    <linearGradient id="lava-chamber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14020a"/>
      <stop offset="35%" stop-color="#2d0517"/>
      <stop offset="70%" stop-color="#3d030f"/>
      <stop offset="100%" stop-color="#180104"/>
    </linearGradient>

    <!-- Dégradé de cire de lave en fusion (jaune d'or, orange magma, rouge incandescent) -->
    <radialGradient id="blob-magma-1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ff3b00"/>
      <stop offset="90%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <radialGradient id="blob-magma-2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Lueur incandescente psychédélique de la lampe -->
    <filter id="lava-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Éclairage central de la lampe à lave -->
    <radialGradient id="lamp-heat" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond liquide sombre de la colonne de lampe -->
  <rect width="1920" height="1080" fill="url(#lava-chamber)"/>
  
  <!-- Halo de chaleur thermique provenant de la base chauffante -->
  <rect width="1920" height="1080" fill="url(#lamp-heat)"/>

  <!-- ========================================================
       BULLES DE CIRE EN SUSPENSION (LAVA BLOBS PSYCHÉDÉLIQUES)
       ======================================================== -->
  <g filter="url(#lava-glow)" opacity="0.65">
    <!-- Grosse goutte principale ascendante au centre droit -->
    <path d="M 1250,550 C 1380,480 1480,600 1440,750 C 1400,900 1280,950 1180,880 C 1080,800 1120,620 1250,550 Z" fill="url(#blob-magma-1)"/>
    
    <!-- Petite bulle qui se détache au-dessus de la grande goutte -->
    <ellipse cx="1320" cy="380" rx="65" ry="85" fill="url(#blob-magma-2)" transform="rotate(-15 1320 380)"/>
    
    <!-- Bulle étirée en forme de poire en bas à gauche (remontée thermique) -->
    <path d="M 450,420 C 580,350 680,480 620,680 C 580,820 420,880 340,780 C 260,680 320,490 450,420 Z" fill="url(#blob-magma-1)"/>
    
    <!-- Bulle ovale en apesanteur en haut au centre -->
    <ellipse cx="880" cy="220" rx="90" ry="110" fill="url(#blob-magma-2)" transform="rotate(25 880 220)"/>
    
    <!-- Petite gouttelette flottante -->
    <circle cx="780" cy="420" r="32" fill="url(#blob-magma-1)"/>
    <circle cx="1060" cy="620" r="42" fill="url(#blob-magma-2)"/>
    <circle cx="560" cy="220" r="28" fill="url(#blob-magma-1)"/>
    <circle cx="1520" cy="320" r="36" fill="url(#blob-magma-2)"/>

    <!-- Grande masse de cire chaude à la base (source de magma) -->
    <path d="M -100,1080 Q 400,820 960,940 Q 1520,800 2020,1080 Z" fill="url(#blob-magma-1)"/>
  </g>

  <!-- Reflets verticaux de verre cylindrique (effet de cylindre de lampe) -->
  <g opacity="0.12">
    <rect x="180" y="0" width="80" height="1080" fill="#ffffff"/>
    <rect x="1660" y="0" width="60" height="1080" fill="#ffffff"/>
  </g>
</svg>
