<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Brume verte douce et apaisante -->
    <linearGradient id="zen-mist-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040e0b"/>
      <stop offset="50%" stop-color="#0a1d17"/>
      <stop offset="100%" stop-color="#030806"/>
    </linearGradient>

    <radialGradient id="mist-soft" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#193b2f" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0b1c17" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030806" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#zen-mist-bg)"/>
  <rect width="1920" height="1080" fill="url(#mist-soft)"/>

  <!-- Silhouettes de Bambou Estompées par la brume -->
  <g opacity="0.22" stroke="#34d399" fill="none">
    <!-- Tige 1 -->
    <path d="M 1600,0 L 1600,1080" stroke-width="8" stroke-dasharray="120, 8"/>
    <!-- Feuilles 1 -->
    <path d="M 1600,240 Q 1550,220 1480,260" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1600,240 Q 1660,210 1720,250" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1600,480 Q 1530,460 1460,510" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1600,720 Q 1670,690 1750,740" stroke-width="3" stroke-linecap="round"/>

    <!-- Tige 2 (plus fine en arrière plan) -->
    <path d="M 1720,0 L 1720,1080" stroke-width="5" stroke-dasharray="100, 6" opacity="0.6"/>
    <path d="M 1720,350 Q 1770,320 1840,360" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Cercle Enso Zen au pinceau d'encre estompée -->
  <g transform="translate(400, 450)" opacity="0.15">
    <path d="M 0,-150 A 150 150 0 1 0 120,-80" fill="none" stroke="#6ee7b7" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
