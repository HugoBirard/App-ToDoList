<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Veines d'or pur 24k -->
    <linearGradient id="gold-vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Ombre marbre noir -->
    <radialGradient id="marble-dark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121217"/>
      <stop offset="70%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>
  </defs>

  <!-- Fond Marbre Noir d'Ébène -->
  <rect width="1920" height="1080" fill="url(#marble-dark)"/>

  <!-- Veines de marbre dorées organiques -->
  <g opacity="0.32" stroke="url(#gold-vein)" fill="none" stroke-linecap="round">
    <!-- Grande veine diagonale principale -->
    <path d="M 0,200 Q 300,180 550,320 T 950,420 T 1450,300 T 1920,450" stroke-width="3.5"/>
    <path d="M 550,320 Q 620,480 800,580 T 1100,750 T 1400,980" stroke-width="2"/>
    <path d="M 950,420 Q 1150,380 1350,150 T 1700,50" stroke-width="1.8"/>
    <path d="M 300,180 Q 220,380 150,650 T 50,950" stroke-width="2"/>
    <path d="M 1200,600 Q 1400,720 1650,850 T 1920,900" stroke-width="2.5"/>
  </g>

  <!-- Motifs géométriques Art Déco subtils aux angles -->
  <g opacity="0.2" stroke="url(#gold-vein)" stroke-width="1.2" fill="none">
    <polygon points="1850,50 1900,50 1900,100"/>
    <polygon points="1830,50 1900,50 1900,120"/>
    <polygon points="70,1030 20,1030 20,980"/>
    <polygon points="90,1030 20,1030 20,960"/>
  </g>
</svg>
