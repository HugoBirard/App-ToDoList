[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todolist-desktop"
version = "1.0.0"
description = "Application ToDoList autonome et locale avec fenêtrage natif GTK, tri par dossiers et persistance SQLite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ToDoList Contributor" }
]
keywords = ["todo", "todolist", "gtk", "sqlite", "desktop-app", "productivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: GTK",
    "Topic :: Office/Business :: Scheduling"
]

[project.scripts]
todolist = "main:main"
